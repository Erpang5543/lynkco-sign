# 领克 App 自动签到 - Quantumult X 重写资源
# 用法: QX 设置 -> 重写 -> + -> 资源 -> 资源路径填本文件地址

hostname = app-api-gw-toc.lynkco.com, app-services.lynkco.com.cn

# 抓取登录态 (refreshToken 在请求 URL 的 query 中)
^https://app-services\.lynkco\.com\.cn/auth/login/refresh url script-request-header https://cdn.jsdelivr.net/gh/Erpang5543/lynkco-sign@main/lynkco-cookie.js

# 业务请求兜底 (从请求头拿 accessToken)
^https://app-api-gw-toc\.lynkco\.com url script-request-header https://cdn.jsdelivr.net/gh/Erpang5543/lynkco-sign@main/lynkco-cookie.js
