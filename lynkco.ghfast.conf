# 领克 App 自动签到 — Quantumult X 重写资源 (ghfast 加速)
# 含: 登录态抓取 / 网关密钥抓取 / 签到请求体录制

hostname = app-api-gw-toc.lynkco.com, app-services.lynkco.com.cn

# 1. 登录态 refreshToken (query 中) + 刷新后的新 accessToken
^https://app-services\.lynkco\.com\.cn/auth/login/refresh url script-request-header https://ghfast.top/https://raw.githubusercontent.com/Erpang5543/lynkco-sign/3d65cebe/lynkco-cookie.js

# 2. 业务请求: 取 accessToken 与 X-Ca-Key
^https://app-api-gw-toc\.lynkco\.com url script-request-header https://ghfast.top/https://raw.githubusercontent.com/Erpang5543/lynkco-sign/3d65cebe/lynkco-cookie.js

# 3. 录制签到请求体 (仅 /user/sign 路径, 用于复现 App 的签到参数)
^https://app-api-gw-toc\.lynkco\.com/up/api/v1/user/sign url script-request-body https://ghfast.top/https://raw.githubusercontent.com/Erpang5543/lynkco-sign/3d65cebe/lynkco-cookie.js
